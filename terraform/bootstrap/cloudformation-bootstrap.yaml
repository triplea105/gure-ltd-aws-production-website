AWSTemplateFormatVersion: "2010-09-09"
Description: Bootstrap Terraform remote state and GitHub Actions OIDC deployment access

Parameters:
  TerraformStateBucketName:
    Type: String
    Default: gure-ltd-terraform-state-232913809627
    Description: Globally unique S3 bucket name used to store Terraform state

  GitHubRepository:
    Type: String
    Default: triplea105/gure-ltd-aws-production-website
    Description: GitHub owner and repository allowed to assume the deployment role

  GitHubEnvironment:
    Type: String
    Default: production
    Description: Protected GitHub environment allowed to assume the deployment role

  GitHubDeploymentRoleName:
    Type: String
    Default: gure-ltd-github-deploy
    Description: IAM role assumed by the GitHub Actions deployment workflow

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref TerraformStateBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: gure-ltd
        - Key: ManagedBy
          Value: cloudformation

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref GitHubDeploymentRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubActionsOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: TerraformStateAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListStateBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TerraformStateBucket.Arn
              - Sid: ManageStateObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${TerraformStateBucket.Arn}/*"
        - PolicyName: TerraformApplicationDeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageApplicationServices
                Effect: Allow
                Action:
                  - acm:AddTagsToCertificate
                  - acm:DeleteCertificate
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:RequestCertificate
                  - apigateway:*
                  - budgets:ModifyBudget
                  - budgets:ListTagsForResource
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ViewBudget
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateOriginAccessControl
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:PutDashboard
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - dynamodb:CreateTable
                  - dynamodb:DeleteItem
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:GetItem
                  - dynamodb:ListTagsOfResource
                  - dynamodb:PutItem
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTable
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunctionConcurrency
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionConcurrency
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:PutFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteMetricFilter
                  - logs:DescribeLogGroups
                  - logs:DescribeMetricFilters
                  - logs:ListTagsForResource
                  - logs:PutMetricFilter
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - route53:ChangeResourceRecordSets
                  - route53:CreateHostedZone
                  - route53:DeleteHostedZone
                  - route53:GetChange
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:ListTagsForResource
                  - route53:ChangeTagsForResource
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:ListTagsForResource
                  - ses:TagResource
                  - ses:UntagResource
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetSubscriptionAttributes
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - sns:Unsubscribe
                  - sns:UntagResource
                  - wafv2:CreateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:ListAvailableManagedRuleGroups
                  - wafv2:ListTagsForResource
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:UpdateWebACL
                Resource: "*"
              - Sid: ManageProjectBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketAcl
                  - s3:GetAccelerateConfiguration
                  - s3:GetBucketCORS
                  - s3:GetBucketLogging
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketRequestPayment
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetBucketWebsite
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetObject
                  - s3:GetObjectTagging
                  - s3:GetOwnershipControls
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutObject
                  - s3:PutOwnershipControls
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:DeleteBucketPolicy
                  - s3:DeleteBucketPublicAccessBlock
                Resource:
                  - arn:aws:s3:::gure-ltd-prod-website-*
                  - arn:aws:s3:::gure-ltd-prod-website-*/*
              - Sid: ManageProjectLambdaRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gure-ltd-*"
              - Sid: CreateRequiredServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - cloudfront.amazonaws.com
                      - wafv2.amazonaws.com
      Tags:
        - Key: Project
          Value: gure-ltd
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  TerraformStateBucketName:
    Description: Terraform backend S3 bucket name
    Value: !Ref TerraformStateBucket

  GitHubDeploymentRoleArn:
    Description: IAM role ARN to configure as the AWS_ROLE_TO_ASSUME GitHub environment secret
    Value: !GetAtt GitHubDeploymentRole.Arn
