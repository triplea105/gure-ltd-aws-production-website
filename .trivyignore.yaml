misconfigurations:
  - id: AVD-AWS-0132
    paths:
      - terraform/modules/s3/main.tf
    statement: Static public website assets use SSE-S3; a customer managed key would add cost and CloudFront key-policy complexity without protecting sensitive data.
    expired_at: 2027-08-30

  - id: AVD-AWS-0136
    paths:
      - terraform/environments/prod/monitoring.tf
    statement: Operational alert messages use the encrypted AWS-managed SNS key; a customer managed key is not required by the current risk or compliance profile.
    expired_at: 2027-08-30
